name: Skill and pipeline validation

on:
  push:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "MDskills-PUBLISHING.md"
      - "social-media-policy-analysis/**"
      - "tests/**"
      - ".github/workflows/v2-tests.yml"
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "MDskills-PUBLISHING.md"
      - "social-media-policy-analysis/**"
      - "tests/**"
      - ".github/workflows/v2-tests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Agent Skills package
        run: python tests/validate_skill.py
      - name: Compile Python scripts
        run: python -m compileall -q social-media-policy-analysis/scripts social-media-policy-analysis/tests tests
      - name: Run unit tests
        run: python -m unittest discover -s social-media-policy-analysis/tests -v
      - name: Synthetic end-to-end smoke test
        run: |
          python social-media-policy-analysis/scripts/v2_pipeline.py generate --rows 40 --seed 20261118 --output /tmp/dummy.csv
          python social-media-policy-analysis/scripts/v2_pipeline.py run /tmp/dummy.csv --outdir /tmp/results --source "synthetic smoke test"
